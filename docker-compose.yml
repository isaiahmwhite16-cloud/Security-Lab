# Security-Lab: Pi-hole (DNS filtering) + Suricata (IDS), both fed by MISP exports.
# MISP itself runs from its own official compose project (misp-docker).
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
    environment:
      TZ: 'America/Los_Angeles'
      # Pi-hole v6 reads its admin password from this variable. Set PIHOLE_PASSWORD in .env
      # (avoid $ characters in the password, Compose treats them as variables).
      FTLCONF_webserver_api_password: '${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}'
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      # Generated by misp_export.py; add file:///lists/misp-iocs.txt as an adlist in Pi-hole.
      - './lists:/lists:ro'
    restart: unless-stopped

  suricata:
    container_name: suricata
    image: jasonish/suricata:latest
    # Share Pi-hole's network namespace so Suricata sees every DNS query Pi-hole receives.
    network_mode: 'service:pihole'
    depends_on:
      - pihole
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    # -S loads ONLY the MISP-generated rules file (run misp_export.py before first start).
    command: ["-i", "eth0", "-S", "/misp-rules/misp.rules"]
    volumes:
      - './suricata/rules:/misp-rules:ro'
      - './suricata/logs:/var/log/suricata'
    restart: unless-stopped
